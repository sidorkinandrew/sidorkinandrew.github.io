/*SOCIAL SHARE EN ARTICULOS POST DETAIL*/

.slds-scrollable_y, .slds-scrollable--y {
    height: auto !important;
}

.share-bar{
    border-top: 3px solid #070F26;
    padding: 20px 0px 0px;
}
.share-txt{
    font-family: 'Noto Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 120%;
    color: #070F26;
     margin-bottom: -20px;
}
a.x7s-social-share__powered-link {
    display: none !important;
}

    background: transparent !important;
    box-shadow: inherit !important;
    font-size: 34px !important;
}

.x7s-social-share__circle[ss_ss-x7sSocialShare_x7sSocialShare] .x7s-social-share__link[ss_ss-x7sSocialShare_x7sSocialShare], .x7s-social-share__circle[ss_ss-x7sSocialShare_x7sSocialShare] .x7s-social-share__plus-link[ss_ss-x7sSocialShare_x7sSocialShare], .x7s-social-share__circle[ss_ss-x7sSocialShare_x7sSocialShare] .x7s-social-share__powered-link[ss_ss-x7sSocialShare_x7sSocialShare]{
    background: transparent !important;
}
/*svg del social icon*/
.x7s-social-share__link[ss_ss-x7sSocialShare_x7sSocialShare] svg[ss_ss-x7sSocialShare_x7sSocialShare] {
    fill: #070F26 !important;
    transition: 0.4s;
}
.x7s-social-share__link[ss_ss-x7sSocialShare_x7sSocialShare]:hover svg[ss_ss-x7sSocialShare_x7sSocialShare]:hover {
    fill: rgba(255, 196, 0, 1) !important;
}
